[workspace]
resolver = "3"
members = [
    "crates/pallet-color",
    "crates/pallet-store",
    "crates/pallet-export",
    "crates/pallet-capture",
    "crates/pallet-overlay",
    "crates/pallet-hotkey",
    "crates/pallet-ipc",
    "crates/pallet-core",
    "apps/pallet-cli",
    "apps/pallet-picker",
]
# apps/pallet-app (Tauri) joins the workspace at M6, once ui/ exists.

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
authors = ["Luke Roxburgh"]
repository = "https://github.com/lukeroxburgh/pallet"

[workspace.dependencies]
# --- internal ---
pallet-color = { path = "crates/pallet-color" }
pallet-store = { path = "crates/pallet-store" }
pallet-export = { path = "crates/pallet-export" }
pallet-capture = { path = "crates/pallet-capture" }
pallet-overlay = { path = "crates/pallet-overlay" }
pallet-hotkey = { path = "crates/pallet-hotkey" }
pallet-ipc = { path = "crates/pallet-ipc" }
pallet-core = { path = "crates/pallet-core" }

# --- foundations (M0) ---
thiserror = "2.0.20"
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
directories = "6.0.0"
clap = { version = "4.6.6", features = ["derive"] }

# --- colour (M1) ---
palette = "0.7.7"

# --- storage (M2) ---
rusqlite = { version = "0.40.2", features = ["bundled"] }
# refinery caps at rusqlite <=0.39 and libsqlite3-sys is a `links` crate, so
# the two cannot coexist. rusqlite_migration wraps PRAGMA user_version and
# tracks current rusqlite releases.
rusqlite_migration = "2.6.0"
time = { version = "0.3.55", features = ["formatting", "parsing", "serde"] }
uuid = { version = "1.26.0", features = ["v4", "serde"] }

# --- capture + overlay (M3/M4) ---
wgpu = "30.0.1"
winit = "0.30.13"
raw-window-handle = "0.6.2"
bytemuck = { version = "1.25.2", features = ["derive"] }
pollster = "1.0.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }

# --- platform: linux ---
smithay-client-toolkit = "0.21.1"
# `system` routes through libwayland rather than the pure-Rust backend, which
# is required to hand raw wl_display/wl_surface pointers to wgpu. `dlopen`
# loads it at runtime instead of linking it, so the binary still starts on a
# machine with no libwayland (an X11-only session, for instance).
wayland-client = { version = "0.31.15", features = ["system", "dlopen"] }
wayland-protocols = { version = "0.32.13", features = ["client", "unstable"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
memmap2 = "0.9.11"
rustix = { version = "1.1.4", features = ["shm", "fs", "mm"] }
ashpd = "0.13.13"
x11rb = "0.14.0"

# --- platform: windows ---
windows = "0.62.2"

# --- platform: macos ---
objc2-screen-capture-kit = "0.3.2"

# --- integration (M5) ---
# `wayland-data-control` is NOT a default feature: without it arboard falls
# back to X11 and, under a Wayland session, quietly sets the XWayland clipboard
# where no native application can see it. `image-data` is dropped because
# Pallet only ever copies text.
arboard = { version = "3.6.1", default-features = false, features = [
    "wayland-data-control",
] }
global-hotkey = "0.8.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
todo = "warn"
dbg_macro = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# The picker must feel instant even in dev builds.
[profile.dev.package."*"]
opt-level = 2
