<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
@keyframes pl-pulse { 0%,100% { opacity: .55 } 50% { opacity: 1 } }
</style>
</helmet>
<div style="position:relative;width:100%;height:100%;overflow:hidden;background:linear-gradient(160deg,#2b3a55 0%,#6b4b6e 45%,#c9736a 78%,#e8b98a 100%);cursor:none;font-family:'Instrument Sans',system-ui,sans-serif" onMouseMove="{{ onMove }}">

  <!-- frozen desktop placeholder content -->
  <div style="position:absolute;inset:0;opacity:.5">
    <div style="position:absolute;left:4%;top:12%;width:30%;height:52%;border-radius:6px;background:repeating-linear-gradient(135deg,rgba(255,255,255,.13) 0 6px,rgba(255,255,255,.03) 6px 12px);border:1px solid rgba(255,255,255,.16)"></div>
    <div style="position:absolute;left:4%;top:12%;width:30%;height:52%;display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;font:400 10px 'IBM Plex Mono',monospace;color:rgba(255,255,255,.6);letter-spacing:.06em">user's screen (frozen)</div>
    <div style="position:absolute;right:6%;top:20%;width:26%;height:34%;border-radius:6px;background:repeating-linear-gradient(135deg,rgba(0,0,0,.16) 0 6px,rgba(0,0,0,.04) 6px 12px);border:1px solid rgba(255,255,255,.12)"></div>
    <div style="position:absolute;left:0;right:0;bottom:0;height:38px;background:rgba(12,14,20,.34);border-top:1px solid rgba(255,255,255,.1)"></div>
  </div>

  <!-- crosshair -->
  <div style="position:absolute;left:0;right:0;height:1px;background:rgba(255,255,255,.5);mix-blend-mode:difference;top:{{ crossY }}"></div>
  <div style="position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.5);mix-blend-mode:difference;left:{{ crossX }}"></div>

  <!-- loupe -->
  <div style="position:absolute;transform:translate(-50%,-50%);left:{{ loupeLeft }};top:{{ loupeTop }};display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none">
    <div style="position:relative;width:176px;height:176px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.35),0 0 0 4px rgba(255,255,255,.92),0 18px 44px -12px rgba(0,0,0,.65)">
      <div style="display:grid;grid-template-columns:repeat(11,1fr);grid-template-rows:repeat(11,1fr);width:100%;height:100%" hint-placeholder-count="0">
        <sc-for list="{{ cells }}" as="cell" hint-placeholder-count="121">
          <div style="background:{{ cell.bg }}"></div>
        </sc-for>
      </div>
      <div style="position:absolute;inset:0;background-image:linear-gradient(to right,rgba(0,0,0,.14) 1px,transparent 1px),linear-gradient(to bottom,rgba(0,0,0,.14) 1px,transparent 1px);background-size:16px 16px"></div>
      <div style="position:absolute;left:50%;top:50%;width:16px;height:16px;transform:translate(-50%,-50%);box-shadow:0 0 0 1.5px #fff,0 0 0 3px rgba(0,0,0,.55)"></div>
      <div style="position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 0 26px rgba(0,0,0,.28)"></div>
    </div>
    <div style="display:flex;align-items:center;gap:8px;padding:5px 6px 5px 5px;border-radius:999px;background:rgba(16,17,21,.9);backdrop-filter:blur(8px);box-shadow:0 6px 18px -6px rgba(0,0,0,.6)">
      <div style="width:18px;height:18px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.28);background:{{ swatch }}"></div>
      <span style="font:500 12px/1 'IBM Plex Mono',monospace;color:#fff;letter-spacing:.04em">{{ hexVal }}</span>
      <span style="font:400 11px/1 'IBM Plex Mono',monospace;color:rgba(255,255,255,.45);padding-right:4px">{{ rgbVal }}</span>
    </div>
  </div>

  <!-- instruction pill -->
  <div style="position:absolute;left:50%;top:22px;transform:translateX(-50%);display:flex;align-items:center;gap:14px;padding:8px 16px;border-radius:999px;background:rgba(16,17,21,.82);backdrop-filter:blur(10px);box-shadow:0 8px 24px -10px rgba(0,0,0,.7);font:400 11.5px/1 'Instrument Sans',sans-serif;color:rgba(255,255,255,.62)">
    <span style="color:#fff">Click to sample</span>
    <span style="opacity:.3">·</span><span>Scroll to zoom</span>
    <span style="opacity:.3">·</span><span>Space locks the loupe</span>
    <span style="opacity:.3">·</span><span>Esc cancels</span>
  </div>

  <!-- multi-pick tray -->
  <div style="position:absolute;left:50%;bottom:22px;transform:translateX(-50%);display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:14px;background:rgba(16,17,21,.82);backdrop-filter:blur(10px);box-shadow:0 10px 30px -12px rgba(0,0,0,.7)">
    <span style="font:400 10px/1 'IBM Plex Mono',monospace;color:rgba(255,255,255,.45);letter-spacing:.1em;text-transform:uppercase">Palette 3 / 5</span>
    <div style="display:flex;gap:6px">
      <div style="width:30px;height:30px;border-radius:7px;background:{{ slot1 }};box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)"></div>
      <div style="width:30px;height:30px;border-radius:7px;background:{{ slot2 }};box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)"></div>
      <div style="width:30px;height:30px;border-radius:7px;background:{{ slot3 }};box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)"></div>
      <div style="width:30px;height:30px;border-radius:7px;border:1px dashed rgba(255,255,255,.35);animation:pl-pulse 2.4s ease-in-out infinite"></div>
      <div style="width:30px;height:30px;border-radius:7px;border:1px dashed rgba(255,255,255,.18)"></div>
    </div>
    <span style="font:400 11px/1 'Instrument Sans',sans-serif;color:rgba(255,255,255,.5)">Enter to save</span>
  </div>

  <div style="position:absolute;right:20px;top:22px;padding:7px 11px;border-radius:8px;background:rgba(16,17,21,.82);font:500 11px/1 'IBM Plex Mono',monospace;color:rgba(255,255,255,.75);letter-spacing:.05em">16×</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:900,&quot;height&quot;:506}}">
const STOPS = [
  { t: 0.00, c: [43, 58, 85] },
  { t: 0.45, c: [107, 75, 110] },
  { t: 0.78, c: [201, 115, 106] },
  { t: 1.00, c: [232, 185, 138] }
];

function ramp(t) {
  t = Math.max(0, Math.min(1, t));
  for (let i = 1; i < STOPS.length; i++) {
    if (t <= STOPS[i].t) {
      const a = STOPS[i - 1], b = STOPS[i];
      const k = (t - a.t) / (b.t - a.t);
      return a.c.map((v, j) => Math.round(v + (b.c[j] - v) * k));
    }
  }
  return STOPS[STOPS.length - 1].c;
}
function toHex(rgb) {
  return '#' + rgb.map(v => Math.max(0, Math.min(255, v)).toString(16).padStart(2, '0')).join('').toUpperCase();
}
function sample(u, v) {
  const axis = u * 0.34 + v * 0.94;
  const grain = Math.sin(u * 22) * 0.012 + Math.sin(v * 17) * 0.014;
  return ramp(axis * 0.92 + grain + 0.04);
}

class Component extends DCLogic {
  state = { u: 0.44, v: 0.56 };

  renderVals() {
    const N = 11, step = 0.010;
    const { u, v } = this.state;
    const cells = [];
    for (let r = 0; r < N; r++) {
      for (let c = 0; c < N; c++) {
        cells.push({
          key: r + '-' + c,
          bg: toHex(sample(u + (c - (N - 1) / 2) * step, v + (r - (N - 1) / 2) * step))
        });
      }
    }
    const rgb = sample(u, v);
    return {
      cells,
      hexVal: toHex(rgb),
      rgbVal: rgb.join(' '),
      swatch: toHex(rgb),
      loupeLeft: (u * 100).toFixed(2) + '%',
      loupeTop: (v * 100).toFixed(2) + '%',
      crossX: (u * 100).toFixed(2) + '%',
      crossY: (v * 100).toFixed(2) + '%',
      slot1: '#F0A9A0', slot2: '#C9736A', slot3: '#6B4B6E',
      onMove: (e) => {
        const b = e.currentTarget.getBoundingClientRect();
        this.setState({
          u: Math.min(1, Math.max(0, (e.clientX - b.left) / b.width)),
          v: Math.min(1, Math.max(0, (e.clientY - b.top) / b.height))
        });
      }
    };
  }
}
</script>
</body>
</html>
