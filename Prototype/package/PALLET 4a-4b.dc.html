<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body { margin: 0; background: #EFEBE4; font-family: Karla, system-ui, sans-serif }
a { color: #C87D5B; text-decoration: none }
a:hover { color: #A05C3C }
</style>
</helmet>
<div style="display:flex;flex-direction:column;gap:26px;padding:44px 48px">
  <div style="display:flex;flex-direction:column;gap:6px">
    <span style="font:400 10px/1 'DM Mono',monospace;letter-spacing:.16em;color:rgba(58,52,44,.45)">PALLET 2.0 — PACKAGE</span>
    <span style="font:700 17px/1.2 Karla,sans-serif;color:#3A342C">Sketchbook and Studio</span>
  </div>
  <div style="display:flex;flex-wrap:wrap;gap:36px;align-items:flex-start">
    <div style="display:flex;flex-direction:column;gap:10px">
      <span style="font:500 11px/1 Karla,sans-serif;color:rgba(58,52,44,.55)">4a · Sketchbook</span>
      <div style="display:flex;width:440px;height:640px">
        <dc-import name="Pallet Window" theme="sketchbook" screen="current" style="width:100%;height:100%" hint-size="440px,640px"></dc-import>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:10px">
      <span style="font:500 11px/1 Karla,sans-serif;color:rgba(58,52,44,.55)">4b · Studio</span>
      <div style="display:flex;width:440px;height:640px">
        <dc-import name="Pallet Window" theme="studio" screen="palettes" style="width:100%;height:100%" hint-size="440px,640px"></dc-import>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script type="text/plain"></script>
</body>
</html>
